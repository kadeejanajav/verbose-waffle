<style>
  :root {
    --bg: #05060a;
    --accent: #22d3ee;
    --accent-2: #a855f7;
    --accent-3: #10b981;
  }
  * { -webkit-font-smoothing: antialiased; }
  html, body { background: var(--bg); color: #e5e7eb; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Animated aurora background */
  .aurora {
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    background: radial-gradient(1200px 800px at 10% -10%, rgba(34,211,238,0.18), transparent 60%),
                radial-gradient(1000px 700px at 110% 20%, rgba(168,85,247,0.18), transparent 60%),
                radial-gradient(900px 600px at 50% 110%, rgba(16,185,129,0.14), transparent 60%),
                #05060a;
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%);
  }
  .orb {
    position: absolute; border-radius: 9999px; filter: blur(80px); opacity: 0.55;
    animation: float 14s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(30px,-40px) scale(1.1); }
  }

  /* Glass card */
  .glass {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .glass:hover { border-color: rgba(255,255,255,0.18); }

  /* Avatar */
  .avatar-ring {
    background: conic-gradient(from 0deg, #22d3ee, #a855f7, #10b981, #22d3ee);
    padding: 3px;
    border-radius: 9999px;
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Gradient text */
  .grad-text {
    background: linear-gradient(90deg, #22d3ee 0%, #a855f7 50%, #10b981 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Cursor blink */
  .cursor { display: inline-block; width: 2px; height: 1em; background: #22d3ee; margin-left: 4px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Skill pill */
  .pill { transition: transform .25s ease, border-color .25s ease, color .25s ease; }
  .pill:hover { transform: translateY(-2px); border-color: rgba(34,211,238,0.6); color: #22d3ee; }

  /* Social button */
  .social {
    transition: all .3s ease;
  }
  .social:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(34,211,238,0.5); }

  /* Reveal animation */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.show { opacity: 1; transform: none; }

  /* Snake accent SVG */
  .snake-path {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: slither 6s ease-in-out infinite;
  }
  @keyframes slither {
    0%   { stroke-dashoffset: 600; }
    50%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -600; }
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #0a0b10; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(#22d3ee, #a855f7); border-radius: 10px; }

  /* Theme toggle */
  .toggle-dot { transition: transform .3s ease, background .3s ease; }
</style>
</head>
