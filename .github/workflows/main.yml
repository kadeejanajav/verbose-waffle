  <!-- FOOTER -->
  <footer class="max-w-6xl mx-auto px-6 py-10 text-center text-sm text-gray-500 mono">
    <p>© <span id="year"></span> Naja — Crafted with ☕ & deployed on GitHub Pages.</p>
    <p class="mt-1 text-xs">Last commit: <span class="text-cyan-300">just now</span></p>
  </footer>

<script>
  // Year
  document.getElementById('year').textContent = new Date().getFullYear();

  // Reveal on scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Counters
  const counterIO = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const target = +el.dataset.counter;
      const duration = 1400;
      const start = performance.now();
      const tick = (now) => {
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.floor(eased * target).toLocaleString();
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target.toLocaleString() + (target >= 100 ? '+' : '');
      };
      requestAnimationFrame(tick);
      counterIO.unobserve(el);
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('[data-counter]').forEach(el => counterIO.observe(el));

  // Theme toggle (aurora <-> soft light)
  const toggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('iconSun');
  const iconMoon = document.getElementById('iconMoon');
  let light = false;
  toggle.addEventListener('click', () => {
    light = !light;
    if (light) {
      document.body.style.background = '#f5f7fb';
      document.body.style.color = '#0f172a';
      document.documentElement.style.setProperty('--bg', '#f5f7fb');
      iconSun.classList.add('hidden'); iconMoon.classList.remove('hidden');
    } else {
      document.body.style.background = '';
      document.body.style.color = '#e5e7eb';
      document.documentElement.style.setProperty('--bg', '#05060a');
      iconMoon.classList.add('hidden'); iconSun.classList.remove('hidden');
    }
  });

  // Smooth scroll
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', (e) => {
      const id = a.getAttribute('href');
      if (id.length > 1) {
        e.preventDefault();
        document.querySelector(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
</script>
</body>
</html>
